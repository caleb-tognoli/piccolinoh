# Lavalink is used only to resolve YouTube links and searches into metadata
# (GET /v4/loadtracks). No audio is played, so no OAuth / poToken is needed.
server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      repository: "https://maven.lavalink.dev/releases"
  server:
    password: "${LAVALINK_PASSWORD}"
    sources:
      # the built-in youtube source is deprecated; youtube-plugin owns it
      youtube: false
      bandcamp: false
      soundcloud: false
      twitch: false
      vimeo: false
      http: false
      local: false

plugins:
  youtube:
    enabled: true
    clients:
      - MUSIC
      - WEB
      - ANDROID_TESTSUITE

logging:
  level:
    root: INFO
    lavalink: INFO
