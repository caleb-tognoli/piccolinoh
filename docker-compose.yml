services:
  piccolinoh:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: piccolinoh
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      NODE_ENV: production
      HTTP_PORT: 3000
      SQLITE_PATH: /app/data/piccolinoh.db
    volumes:
      - piccolinoh_data:/app/data

volumes:
  piccolinoh_data:
